services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_password
      POSTGRES_DB: expense_flow
    ports:
      - "5432:5432"
    volumes:
      - expense_flow_postgres_data:/var/lib/postgresql/data

volumes:
  expense_flow_postgres_data:
