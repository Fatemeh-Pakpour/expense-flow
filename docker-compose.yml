services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - expense_flow_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: expense-flow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - expense_flow_redis_data:/data

volumes:
  expense_flow_postgres_data:
  expense_flow_redis_data:
